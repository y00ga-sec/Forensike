[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forensike"
version = "2.0.0"
description = "Offensive Forensics — crash dump based credential extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "y00ga" },
]

dependencies = [
    "impacket>=0.11.0",
    "volatility3>=2.4.0",
    "pypykatz>=0.6.0",
]

[project.optional-dependencies]
metadata = ["pefile>=2023.2.7"]

[project.scripts]
forensike = "forensike.cli:main"
lsass-extract = "forensike.lsass_extract:main"

[project.urls]
Homepage = "https://github.com/y00ga-sec/Forensike"
